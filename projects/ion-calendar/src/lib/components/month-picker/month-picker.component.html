<div [class]="'month-picker ' + color">
	@for (month of _monthsTitle; let idx = $index; track idx) {
	<div
		class="month-packer-item"
		[class.this-month]=" idx === _thisMonth.getMonth()"
		[class.active]=" idx === monthSelected"
	>
		<button
			type="button"
			(click)="_onSelect(idx+1)"
			[attr.aria-label]="getDate(idx) | date:MONTH_FORMAT"
		>
			{{ month }}
		</button>
	</div>
	}
</div>
