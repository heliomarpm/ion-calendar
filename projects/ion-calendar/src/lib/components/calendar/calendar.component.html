<div class="title">
	@if (showMonthPicker && !readonly) {
	<ion-button
		type="button"
		fill="clear"
		class="switch-btn"
		(click)="switchView()"
		mode="md"
	>
		{{ monthFormat(monthOpt.original.time) }}
		<ion-icon class="arrow-dropdown" [name]="switchIcon()"></ion-icon>
	</ion-button>
	} @else {
	<div class="switch-btn">{{ monthFormat(monthOpt.original.time) }}</div>
	} @if (showNavigateButtons && !readonly) {
	<ion-button
		type="button"
		fill="clear"
		class="back"
		[disabled]="!canPrev()"
		(click)="prev()"
	>
		<ion-icon slot="icon-only" size="small" name="chevron-back"></ion-icon>
	</ion-button>
	<ion-button
		type="button"
		fill="clear"
		class="forward"
		[disabled]="!canNext()"
		(click)="next()"
	>
		<ion-icon slot="icon-only" size="small" name="chevron-forward"></ion-icon>
	</ion-button>
	}
</div>

@if (view === 'days') {
<ion-calendar-week
	color="transparent"
	[weekDays]="def.weekdays"
	[weekStart]="def.weekStart??0"
> </ion-calendar-week>

<!-- (swipe)="onSwipe($event)" -->
<ion-calendar-month
	class="component-mode"
	[(ngModel)]="calendarMonthValue"
	[month]="monthOpt"
	[readonly]="readonly"
	(onChange)="onChanged($event)"
	(onSelect)="onSelect.emit($event)"
	(onSelectStart)="onSelectStart.emit($event)"
	(onSelectEnd)="onSelectEnd.emit($event)"
	[pickMode]="def.pickMode||'single'"
	[color]="def.color"
	[colorSubtitle]="def.colorSubtitle"
> </ion-calendar-month>
} @if (view === 'month') {
<ion-month-picker
	(onSelect)="onMonthSelect($event)"
	[color]="def.color!"
	[month]="monthOpt"
	[monthsTitle]="_monthsTitle"
> </ion-month-picker>
} @if (view === 'year') {
<ion-year-picker
	(onSelect)="onYearSelect($event)"
	[color]="def.color!"
	[year]="monthOpt.original.year"
	[yearStep]="yearStep"
> </ion-year-picker>
}
