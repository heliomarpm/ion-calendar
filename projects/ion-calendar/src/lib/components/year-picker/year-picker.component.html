<div [class]="'year-picker ' + color">
    @for (year of _yearRanges; track year) {
    <div class="year-packer-item" [class.this-year]="year === _thisYear.getFullYear()" [class.active]="year === year">
        <button type="button" (click)="_onSelect(year)">
            {{ year }}
        </button>
    </div>
    }
</div>
